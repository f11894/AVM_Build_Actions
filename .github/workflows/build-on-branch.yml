name: Build on branch

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        branch: [v1.0.0]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            mingw-w64-x86-64-dev \
            nasm \
            yasm \
            pkg-config \
            git \
            p7zip-full

      - name: Build AVM
        shell: bash
        run: |
          export LDFLAGS="-static -static-libgcc -static-libstdc++ -s"

          git clone --depth 1 -b "${{ matrix.branch }}" \
            https://github.com/AOMediaCodec/avm.git

          AVM_VERSION=$(cd avm && git describe --tags --always)

          cmake -S avm -B avm_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/x86_64-mingw-gcc.cmake \
            -DCONFIG_ML_PART_SPLIT=0 \
            -DCONFIG_DIP_EXT_PRUNING=0

          cmake --build avm_build --parallel

          mkdir -p package
          cp avm_build/avmenc.exe package/
          cp avm_build/avmdec.exe package/
          cp avm/LICENSE package/
          cp avm/PATENTS package/
          cp avm/AUTHORS package/

          cd package
          7z a "../avm_${AVM_VERSION}_GCC_x64.7z" *

      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: avm
          path: avm_*.7z

  create_release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: avm
          path: artifacts

      - name: Get Date
        id: get_date
        run: |
          DATE_TIME=$(date +'%Y-%m-%d-%H-%M-%S')
          echo "DATE_TIME=${DATE_TIME}" >> "$GITHUB_OUTPUT"

      - name: Create a Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=build-${{ steps.get_date.outputs.DATE_TIME }}

          assets=()
          for asset in "${{ github.workspace }}"/artifacts/*.7z; do
            assets+=("$asset")
          done

          gh release create "$TAG_NAME" "${assets[@]}"
