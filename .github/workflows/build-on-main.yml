name: Build on main

on:
  push:
    branches:
      - main
  schedule:
      - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Install build dependencies
      run: |
        choco install --no-progress -y ninja
        yasm --version || choco install --no-progress -y yasm
    - name: build
      run: |
        git clone https://github.com/AOMediaCodec/avm
        cd avm
        cmake -B avm_build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_DOCS=0 -DENABLE_TESTS=0
        cmake --build avm_build -j
    - name: postprocessing
      shell: cmd
      run: |
        copy /y avm\avm_build\*.exe .\
        copy /y avm\LICENSE LICENSE
        copy /y avm\PATENTS PATENTS
        for /f "tokens=7" %%i in ('avmenc.exe --help ^| find "AOMedia Project"') do set "avm_version=%%~i"
        7z a "avm_v%avm_version%_GCC_x64.7z" avmenc.exe avmdec.exe LICENSE PATENTS
    - name: Upload result
      uses: actions/upload-artifact@v7
      with:
        name: avm
        path: |
          avm_*.7z

  create_release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - uses: actions/download-artifact@v6
      with:
        name: avm
        path: artifacts
    
    - name: Get Date
      id: get_date
      run: |
        DATE_TIME=`date +'%Y-%m-%d-%H-%M-%S'`
        echo "DATE_TIME=${DATE_TIME}" >> $GITHUB_OUTPUT        
    # https://github.com/Mr-Ojii/L-SMASH-Works-Auto-Builds
    - name: Create a Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME=build-${{ steps.get_date.outputs.DATE_TIME }}
        assets=()
        for asset in ${{ github.workspace }}/artifacts/*.7z; do
          assets+=("$asset")
        done
        gh release create "$TAG_NAME" "${assets[@]}"
        